# Los tests usan H2 en memoria: nunca tocan la base MySQL real
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Contrasenas ficticias solo para tests
app.seed.admin-password=test-admin-pass
app.seed.cliente-password=test-cliente-pass

# Secreto JWT ficticio solo para tests (minimo 32 caracteres)
jwt.secret=secreto-ficticio-solo-para-tests-0123456789-abcdef
jwt.expiration-ms=3600000
