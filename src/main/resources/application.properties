spring.application.name=sistema-pedidos

# --- MySQL (credenciales desde variables de entorno, nunca en el repositorio) ---
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Usuarios de prueba (contrasenas solo por variable de entorno) ---
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.cliente-password=${CLIENTE_PASSWORD:}
