spring.application.name=sistema-pedidos

# --- MySQL (credenciales desde variables de entorno, nunca en el repositorio) ---
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Usuarios de prueba (contrasenas solo por variable de entorno) ---
app.seed.admin-password=admin123
app.seed.cliente-password=cliente123

# --- JWT (el secreto solo por variable de entorno; la app no arranca sin el) ---
jwt.secret=${JWT_SECRET:esta_es_una_clave_secreta_muy_larga_y_segura_para_el_jwt_token_12345}
jwt.expiration-ms=3600000
